<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Architectural Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123C3A"/>
      <stop offset="60%" stop-color="#1B2927"/>
      <stop offset="100%" stop-color="#242B2A"/>
    </linearGradient>

    <linearGradient id="sandstoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CCA7"/>
      <stop offset="50%" stop-color="#D7B98E"/>
      <stop offset="100%" stop-color="#B89565"/>
    </linearGradient>

    <linearGradient id="sandstoneGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7B98E"/>
      <stop offset="70%" stop-color="#A88251"/>
      <stop offset="100%" stop-color="#7D5C32"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24594D" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#1B473D"/>
      <stop offset="100%" stop-color="#0E2823"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24594D"/>
      <stop offset="50%" stop-color="#D7B98E"/>
      <stop offset="100%" stop-color="#24594D"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D7B98E" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="14" fill="url(#skyGrad)"/>
  <rect width="1200" height="420" rx="14" fill="url(#gridPattern)"/>

  <!-- Outer Architectural Framing Border -->
  <rect x="16" y="16" width="1168" height="388" rx="10" fill="none" stroke="#D7B98E" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="22" y="22" width="1156" height="376" rx="8" fill="none" stroke="#24594D" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Left: Geometric Stepwell Illustration (Isometric & Orthogonal Heritage Profile) -->
  <g transform="translate(60, 48)">
    <!-- Subterranean Pit Aperture -->
    <polygon points="170,30 330,30 360,280 140,280" fill="#131B1A" stroke="#D7B98E" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Stepped Tier Levels (Descending Terraces) -->
    <!-- Tier 1 -->
    <polygon points="150,55 350,55 345,75 155,75" fill="url(#sandstoneGrad1)"/>
    <polygon points="155,75 345,75 342,95 158,95" fill="url(#sandstoneGrad2)"/>

    <!-- Tier 2 -->
    <polygon points="160,105 340,105 336,125 164,125" fill="url(#sandstoneGrad1)"/>
    <polygon points="164,125 336,125 333,145 167,145" fill="url(#sandstoneGrad2)"/>

    <!-- Tier 3 -->
    <polygon points="170,155 330,155 327,175 173,175" fill="url(#sandstoneGrad1)"/>
    <polygon points="173,175 327,175 324,195 176,195" fill="url(#sandstoneGrad2)"/>

    <!-- Tier 4 -->
    <polygon points="180,205 320,205 317,225 183,225" fill="url(#sandstoneGrad1)"/>
    <polygon points="183,225 317,225 314,245 186,245" fill="url(#sandstoneGrad2)"/>

    <!-- Symmetrical Triangular Steps (Bawari / Kund Pattern) -->
    <!-- Left Flight -->
    <polygon points="155,75 185,115 155,115" fill="#E5CCA7"/>
    <polygon points="185,115 215,155 185,155" fill="#D7B98E"/>
    <polygon points="215,155 245,195 215,195" fill="#B89565"/>
    <polygon points="165,115 195,155 165,155" fill="#7D5C32"/>
    <polygon points="195,155 225,195 195,195" fill="#5C4222"/>

    <!-- Right Flight -->
    <polygon points="345,75 315,115 345,115" fill="#E5CCA7"/>
    <polygon points="315,115 285,155 315,155" fill="#D7B98E"/>
    <polygon points="285,155 255,195 285,195" fill="#B89565"/>
    <polygon points="335,115 305,155 335,155" fill="#7D5C32"/>
    <polygon points="305,155 275,195 305,195" fill="#5C4222"/>

    <!-- Subterranean Water Reservoir Pool -->
    <polygon points="190,250 310,250 305,295 195,295" fill="url(#waterGrad)" stroke="#24594D" stroke-width="1.5"/>
    <!-- Water Ripples -->
    <path d="M 210 265 Q 250 260 290 265" fill="none" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 218 277 Q 250 273 282 277" fill="none" stroke="#F7F4EC" stroke-width="0.75" stroke-opacity="0.3"/>

    <!-- Central Pavilion Arch Silhouette (Kuta / Gokh) -->
    <path d="M 225 155 C 225 110, 250 95, 250 95 C 250 95, 275 110, 275 155 Z" fill="#121817" stroke="#D7B98E" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Inspection Reticle Overlay (Demonstrating Computer Vision Non-Invasive Observation) -->
    <rect x="145" y="65" width="80" height="60" fill="none" stroke="#E5CCA7" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.8"/>
    <circle cx="145" cy="65" r="2.5" fill="#D7B98E"/>
    <circle cx="225" cy="65" r="2.5" fill="#D7B98E"/>
    <circle cx="145" cy="125" r="2.5" fill="#D7B98E"/>
    <circle cx="225" cy="125" r="2.5" fill="#D7B98E"/>
    <text x="150" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D7B98E" letter-spacing="1">ROI: ASHLAR_JOINT</text>

    <!-- Calibration / Scale Baseline -->
    <line x1="140" y1="310" x2="360" y2="310" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="140" y1="305" x2="140" y2="315" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="250" y1="307" x2="250" y2="313" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="360" y1="305" x2="360" y2="315" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.5"/>
    <text x="215" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#D7B98E" letter-spacing="1.5" opacity="0.75">IKS HYDRAULIC AXIS</text>
  </g>

  <!-- Right: Project Title, Positioning, and Core Pillars -->
  <g transform="translate(490, 70)">
    <!-- Small Category Kicker -->
    <g transform="translate(0, 18)">
      <rect x="0" y="-12" width="220" height="22" rx="4" fill="#24594D" fill-opacity="0.35" stroke="#24594D" stroke-width="1"/>
      <circle cx="12" cy="-1" r="3.5" fill="#D7B98E"/>
      <text x="22" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#D7B98E" letter-spacing="1.8">HERITAGE CONSERVATION AI</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', serif" font-size="52" font-weight="800" fill="#F7F4EC" letter-spacing="1.5">
      JalDrishti
    </text>
    <text x="282" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', serif" font-size="28" font-weight="500" fill="#D7B98E" letter-spacing="2" opacity="0.9">
      जलदृष्टि
    </text>

    <!-- Tagline -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500" fill="#E5CCA7" letter-spacing="0.4">
      AI-Assisted Conservation of Traditional Indian Water Heritage
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#F7F4EC" fill-opacity="0.78" letter-spacing="0.2">
      Bridging non-invasive computer vision, deterministic engineering science,
    </text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#F7F4EC" fill-opacity="0.78" letter-spacing="0.2">
      and Indian Knowledge Systems (IKS) to safeguard stepwells, baolis, and kunds.
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="195" width="620" height="1.5" fill="url(#accentTeal)" opacity="0.6"/>

    <!-- 4 Pipeline Pillars (SEE - UNDERSTAND - ASSESS - REVIVE) -->
    <g transform="translate(0, 218)">
      <!-- Pillar 1: SEE -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="142" height="48" rx="6" fill="#172220" stroke="#24594D" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="1">SEE (दृष्टि)</text>
        <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#F7F4EC" fill-opacity="0.75">YOLOv8 + OpenCV</text>
      </g>

      <!-- Pillar 2: UNDERSTAND -->
      <g transform="translate(154, 0)">
        <rect x="0" y="0" width="148" height="48" rx="6" fill="#172220" stroke="#24594D" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="1">UNDERSTAND</text>
        <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#F7F4EC" fill-opacity="0.75">IKS Knowledge Base</text>
      </g>

      <!-- Pillar 3: ASSESS -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="142" height="48" rx="6" fill="#172220" stroke="#24594D" stroke-width="1"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="1">ASSESS (परीक्षण)</text>
        <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#F7F4EC" fill-opacity="0.75">7-D Compatibility</text>
      </g>

      <!-- Pillar 4: REVIVE -->
      <g transform="translate(468, 0)">
        <rect x="0" y="0" width="148" height="48" rx="6" fill="#172220" stroke="#24594D" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="1">REVIVE (पुनर्निर्माण)</text>
        <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#F7F4EC" fill-opacity="0.75">Phased Restoration</text>
      </g>
    </g>

    <!-- Bottom Key Architecture Disclosures -->
    <g transform="translate(0, 288)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" fill-opacity="0.9" font-weight="500" letter-spacing="0.5">
        ✦ Sovereign India-First Architecture
      </text>
      <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" fill-opacity="0.9" font-weight="500" letter-spacing="0.5">
        ✦ Strict JSON Schema Contracts
      </text>
      <text x="410" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" fill-opacity="0.9" font-weight="500" letter-spacing="0.5">
        ✦ Zero-Hallucination Engineering Rules
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="auto">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122A28"/>
      <stop offset="100%" stop-color="#182221"/>
    </linearGradient>
    <linearGradient id="limeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24594D"/>
      <stop offset="100%" stop-color="#4E9982"/>
    </linearGradient>
    <linearGradient id="cementBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A2E2E"/>
      <stop offset="100%" stop-color="#B84343"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="500" rx="14" fill="url(#matrixBg)"/>
  <rect x="12" y="12" width="976" height="476" rx="10" fill="none" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Header -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#F7F4EC" letter-spacing="0.3">
    The 7 Dimensions of Material Compatibility
  </text>
  <text x="40" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#D7B98E" letter-spacing="0.2">
    Scientific Benchmark (RILEM TC 203-RHM / ASI 2020) • Traditional Lime-Surkhi vs. Destructive OPC Cement
  </text>

  <!-- Legend -->
  <g transform="translate(640, 32)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#4E9982"/>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4E9982">Lime Mortar (Traditional)</text>
    <rect x="175" y="0" width="12" height="12" rx="3" fill="#B84343"/>
    <text x="193" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E57373">OPC Cement (Alien)</text>
  </g>

  <!-- Table Header -->
  <line x1="40" y1="90" x2="960" y2="90" stroke="#D7B98E" stroke-width="1" stroke-opacity="0.4"/>
  <text x="40" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="0.5">DIMENSION &amp; WEIGHT</text>
  <text x="215" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="0.5">SCIENTIFIC BENCHMARK &amp; EFFECT</text>
  <text x="510" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="0.5">COMPATIBILITY COMPARISON</text>
  <text x="870" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D7B98E" letter-spacing="0.5">RATING</text>
  <line x1="40" y1="120" x2="960" y2="120" stroke="#D7B98E" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Row 1: Moisture (0.25) -->
  <g transform="translate(40, 130)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F7F4EC">1. Moisture Breathability</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" opacity="0.8">Weight: 0.25 (IS 3115 / ASI)</text>
    <text x="215" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F7F4EC">Permeability &gt; 15 Perm (vapor-open)</text>
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D7B98E" opacity="0.75">Prevents rising damp &amp; cryptoflorescence</text>

    <!-- Bars & Scores -->
    <rect x="510" y="8" width="144" height="12" rx="3" fill="url(#limeBar)"/>
    <text x="670" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4E9982" font-weight="700">0.96 / 1.0</text>
    <rect x="510" y="26" width="18" height="12" rx="3" fill="url(#cementBar)"/>
    <text x="536" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E57373" font-weight="600">0.12 (Traps Water)</text>

    <!-- Rating Badge -->
    <rect x="835" y="12" width="70" height="24" rx="4" fill="#14332B" stroke="#4E9982" stroke-width="1"/>
    <text x="870" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4E9982">PASS</text>
  </g>
  <line x1="40" y1="184" x2="960" y2="184" stroke="#D7B98E" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Row 2: Mechanical (0.20) -->
  <g transform="translate(40, 194)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F7F4EC">2. Mechanical Sacrificiality</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" opacity="0.8">Weight: 0.20 (RILEM TC 203)</text>
    <text x="215" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F7F4EC">Mortar strength (1.5–5 MPa) &lt; Host stone</text>
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D7B98E" opacity="0.75">Mortar yields under settlement; shields ashlar arrises</text>

    <!-- Bars & Scores -->
    <rect x="510" y="8" width="138" height="12" rx="3" fill="url(#limeBar)"/>
    <text x="670" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4E9982" font-weight="700">0.92 / 1.0</text>
    <rect x="510" y="26" width="27" height="12" rx="3" fill="url(#cementBar)"/>
    <text x="546" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E57373" font-weight="600">0.18 (Too Stiff)</text>

    <!-- Rating Badge -->
    <rect x="835" y="12" width="70" height="24" rx="4" fill="#14332B" stroke="#4E9982" stroke-width="1"/>
    <text x="870" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4E9982">PASS</text>
  </g>
  <line x1="40" y1="248" x2="960" y2="248" stroke="#D7B98E" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Row 3: Chemical (0.15) -->
  <g transform="translate(40, 258)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F7F4EC">3. Chemical Inertness</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" opacity="0.8">Weight: 0.15 (RILEM TC 203)</text>
    <text x="215" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F7F4EC">Zero soluble sulfates / alkali leaching</text>
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D7B98E" opacity="0.75">Eliminates expansive ettringite/thaumasite cracking</text>

    <!-- Bars & Scores -->
    <rect x="510" y="8" width="142" height="12" rx="3" fill="url(#limeBar)"/>
    <text x="670" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4E9982" font-weight="700">0.95 / 1.0</text>
    <rect x="510" y="26" width="10" height="12" rx="3" fill="url(#cementBar)"/>
    <text x="528" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E57373" font-weight="600">0.05 (Salt Leaching)</text>

    <!-- Rating Badge -->
    <rect x="835" y="12" width="70" height="24" rx="4" fill="#14332B" stroke="#4E9982" stroke-width="1"/>
    <text x="870" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4E9982">PASS</text>
  </g>
  <line x1="40" y1="312" x2="960" y2="312" stroke="#D7B98E" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Row 4: Reversibility (0.15) -->
  <g transform="translate(40, 322)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F7F4EC">4. Reversibility</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" opacity="0.8">Weight: 0.15 (INTACH / Venice)</text>
    <text x="215" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F7F4EC">Removable by hand chiseling without fracture</text>
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D7B98E" opacity="0.75">Complies with fundamental international charters</text>

    <!-- Bars & Scores -->
    <rect x="510" y="8" width="132" height="12" rx="3" fill="url(#limeBar)"/>
    <text x="670" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4E9982" font-weight="700">0.88 / 1.0</text>
    <rect x="510" y="26" width="8" height="12" rx="3" fill="url(#cementBar)"/>
    <text x="526" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E57373" font-weight="600">0.02 (Irreversible)</text>

    <!-- Rating Badge -->
    <rect x="835" y="12" width="70" height="24" rx="4" fill="#14332B" stroke="#4E9982" stroke-width="1"/>
    <text x="870" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4E9982">PASS</text>
  </g>
  <line x1="40" y1="376" x2="960" y2="376" stroke="#D7B98E" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Row 5-7: Heritage, Thermal & Visual (0.30 combined) -->
  <g transform="translate(40, 386)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F7F4EC">5–7. Heritage &amp; Thermal</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#D7B98E" opacity="0.8">Visual &amp; IKS DNA (0.30 total)</text>
    <text x="215" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F7F4EC">Δα &lt; 3.0×10⁻⁶/K; IKS herbal pozzolana match</text>
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#D7B98E" opacity="0.75">No interfacial shear delamination under diurnal swings</text>

    <!-- Bars & Scores -->
    <rect x="510" y="8" width="141" height="12" rx="3" fill="url(#limeBar)"/>
    <text x="670" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4E9982" font-weight="700">0.94 / 1.0</text>
    <rect x="510" y="26" width="30" height="12" rx="3" fill="url(#cementBar)"/>
    <text x="548" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#E57373" font-weight="600">0.20 (Alien Shearing)</text>

    <!-- Rating Badge -->
    <rect x="835" y="12" width="70" height="24" rx="4" fill="#14332B" stroke="#4E9982" stroke-width="1"/>
    <text x="870" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4E9982">PASS</text>
  </g>

  <!-- Final Verdict Banners -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="450" height="34" rx="6" fill="#14332B" stroke="#24594D" stroke-width="1"/>
    <text x="225" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#4E9982">
      HYDRAULIC LIME-SURKHI: COMPATIBLE (Score: 0.93 / 1.0)
    </text>

    <rect x="470" y="0" width="450" height="34" rx="6" fill="#381818" stroke="#7A2E2E" stroke-width="1"/>
    <text x="695" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#E57373">
      ORDINARY PORTLAND CEMENT: PROHIBITED (Score: 0.12 / 1.0)
    </text>
  </g>
</svg>

services:
  - type: web
    name: jaldrishti
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "https://jaldrishti-sigma.vercel.app,https://jaldrishti-frontend.vercel.app,http://localhost:5173"
      - key: LOG_LEVEL
        value: info
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
